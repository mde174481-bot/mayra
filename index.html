<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090710" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mayra • মায়রা</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root {
      --bg-dark: #07060b;
      --bg-card: rgba(20, 15, 32, 0.72);
      --border-glass: rgba(244, 114, 182, 0.18);
      --pink: #ec4899;
      --pink-soft: #f472b6;
      --violet: #a855f7;
      --violet-deep: #6d28d9;
      --text-main: #f8f5ff;
      --text-muted: #a699c2;
      --orb-scale: 1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
      overflow: hidden; touch-action: manipulation;
    }
    .app-shell {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      height: 100dvh; width: 100%; max-width: 480px; margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      overflow: hidden;
    }
    .bg-glow {
      position: absolute; border-radius: 50%; filter: blur(80px);
      opacity: 0.35; pointer-events: none; z-index: 0;
    }
    .bg-glow-1 { width: 260px; height: 260px; background: var(--violet-deep); top: -60px; left: -60px; }
    .bg-glow-2 { width: 280px; height: 280px; background: var(--pink); bottom: -80px; right: -70px; opacity: 0.25; }
    .top-bar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #64748b; box-shadow: 0 0 10px rgba(100,116,139,0.5); transition: 0.3s;
    }
    .brand-dot.online { background: #34d399; box-shadow: 0 0 12px rgba(52,211,153,0.85); }
    .brand h1 {
      margin: 0; font-size: 1.25rem; font-weight: 700;
      background: linear-gradient(135deg, #fff, #f9a8d4, #c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { display: block; font-size: 0.74rem; color: var(--text-muted); }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--border-glass);
      background: var(--bg-card); color: var(--text-main); display: grid; place-items: center;
      cursor: pointer; backdrop-filter: blur(12px);
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn.small { width: 34px; height: 34px; border-radius: 10px; }
    .stage {
      position: relative; z-index: 2; flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    }
    .status-pill {
      padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(244,114,182,0.22); backdrop-filter: blur(12px);
      font-size: 0.85rem; color: #f5d0fe; text-align: center; max-width: 92%;
    }
    .orb-wrapper { position: relative; width: 210px; height: 210px; display: grid; place-items: center; }
    .orb-aura {
      position: absolute; inset: 10px; border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,0.45), rgba(168,85,247,0.25), transparent 72%);
      filter: blur(22px); transform: scale(var(--orb-scale)); transition: transform 0.08s linear;
    }
    .orb-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(244,114,182,0.22); pointer-events: none; }
    .ring-outer { inset: 0; animation: spinSlow 16s linear infinite; border-style: dashed; border-color: rgba(168,85,247,0.28); }
    .ring-mid { inset: 18px; border-color: rgba(236,72,153,0.32); }
    .orb-btn {
      position: relative; width: 144px; height: 144px; border-radius: 50%; border: none; padding: 3px;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      box-shadow: 0 0 32px rgba(236,72,153,0.42), 0 0 64px rgba(168,85,247,0.25);
      cursor: pointer; transform: scale(var(--orb-scale)); transition: transform 0.1s ease, box-shadow 0.3s ease;
    }
    .orb-core {
      width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2a1842, #110b1d 70%, #090611);
      display: grid; place-items: center; box-shadow: inset 0 0 24px rgba(244,114,182,0.32);
    }
    .mic-icon { width: 44px; height: 44px; color: #fdf2f8; filter: drop-shadow(0 0 10px rgba(244,114,182,0.7)); }
    .orb-wrapper[data-state="idle"] .orb-btn { animation: breatheIdle 3.6s ease-in-out infinite; }
    .orb-wrapper[data-state="connecting"] .orb-btn { animation: pulseConnect 1.1s ease-in-out infinite; }
    .orb-wrapper[data-state="listening"] .ring-mid { animation: ripplePulse 1.8s ease-out infinite; border-color: rgba(244,114,182,0.7); }
    .orb-wrapper[data-state="listening"] .orb-btn { box-shadow: 0 0 42px rgba(236,72,153,0.7), 0 0 85px rgba(168,85,247,0.45); }
    .orb-wrapper[data-state="speaking"] .ring-mid { animation: ripplePulse 1.1s ease-out infinite; border-color: rgba(192,132,252,0.85); }
    .orb-wrapper[data-state="speaking"] .orb-btn {
      background: linear-gradient(135deg, #f472b6, #c084fc, #818cf8);
      box-shadow: 0 0 50px rgba(192,132,252,0.8), 0 0 95px rgba(236,72,153,0.55);
    }
    .orb-wrapper[data-state="error"] .orb-btn { background: linear-gradient(135deg, #fb7185, #be123c); }
    .transcript-box {
      width: 100%; min-height: 74px; max-height: 120px; overflow-y: auto;
      padding: 12px 16px; border-radius: 18px; background: rgba(18,13,29,0.65);
      border: 1px solid rgba(255,255,255,0.07); backdrop-filter: blur(12px);
      font-size: 0.88rem; line-height: 1.45;
    }
    .transcript-hint { margin: 0; color: var(--text-muted); text-align: center; font-size: 0.82rem; }
    .transcript-line { margin: 4px 0; }
    .user-line { color: #f9a8d4; }
    .model-line { color: #e9d5ff; }
    .bottom-bar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .voice-badge {
      font-size: 0.76rem; color: var(--text-muted); padding: 6px 12px;
      border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    }
    .pill-btn {
      border: 1px solid var(--border-glass); background: var(--bg-card); color: var(--text-main);
      padding: 9px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 500; cursor: pointer;
    }
    .pill-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pill-btn.active { background: rgba(236,72,153,0.22); border-color: var(--pink); color: #fbcfe8; }
    .pill-btn.danger { border-color: rgba(251,113,133,0.45); color: #fecdd3; background: rgba(190,18,60,0.22); }
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(3,2,7,0.72); backdrop-filter: blur(4px); z-index: 20; }
    .settings-drawer {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 100%; max-width: 480px; max-height: 88dvh; background: #110c1c;
      border-top: 1px solid rgba(244,114,182,0.25); border-radius: 26px 26px 0 0;
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); z-index: 30;
      display: flex; flex-direction: column; box-shadow: 0 -16px 50px rgba(0,0,0,0.75);
      animation: slideUp 0.24s ease-out;
    }
    .drawer-handle { width: 42px; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.2); margin: 0 auto 12px; }
    .drawer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .drawer-header h2 { margin: 0; font-size: 1.1rem; }
    .drawer-body { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; }
    .field label { font-size: 0.82rem; color: #e9d5ff; font-weight: 500; }
    .field small { font-size: 0.74rem; color: var(--text-muted); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
      color: var(--text-main); font-size: 0.9rem; font-family: inherit; outline: none;
    }
    .field select option { background: #140e22; color: #f8f5ff; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--pink-soft); }
    .input-row { display: flex; gap: 8px; }
    .toggle-vis-btn {
      padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); color: var(--text-main); font-size: 0.8rem; cursor: pointer;
    }
    .text-link { background: none; border: none; color: var(--pink-soft); font-size: 0.78rem; cursor: pointer; padding: 0; }
    .save-btn {
      margin-top: 4px; padding: 13px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .save-toast { margin: 0; text-align: center; font-size: 0.82rem; color: #6ee7b7; }
    .hidden { display: none !important; }
    @keyframes breatheIdle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    @keyframes pulseConnect { 0%, 100% { opacity: 0.7; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes ripplePulse { 0% { transform: scale(0.95); opacity: 0.85; } 100% { transform: scale(1.38); opacity: 0; } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header class="top-bar">
      <div class="brand">
        <span class="brand-dot" id="connectionDot"></span>
        <div>
          <h1 id="assistantTitle">Mayra</h1>
          <span class="subtitle">মায়রা • Personal Voice AI</span>
        </div>
      </div>
      <button class="icon-btn" id="openSettingsBtn" aria-label="Open Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <main class="stage">
      <div class="status-pill"><span id="statusText">Tap orb to talk to Mayra</span></div>

      <div class="orb-wrapper" id="orbWrapper" data-state="idle">
        <div class="orb-ring ring-outer"></div>
        <div class="orb-ring ring-mid"></div>
        <div class="orb-aura"></div>
        <button class="orb-btn" id="orbBtn" aria-label="Talk to Mayra">
          <div class="orb-core">
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </div>
        </button>
      </div>

      <div class="transcript-box">
        <p class="transcript-hint" id="transcriptHint">"হ্যালো মায়রা, কেমন আছো?" — বাংলা বা ইংরেজিতে কথা বলুন।</p>
        <p class="transcript-line user-line hidden" id="userTranscript"></p>
        <p class="transcript-line model-line hidden" id="modelTranscript"></p>
      </div>
    </main>

    <footer class="bottom-bar">
      <button class="pill-btn" id="muteBtn" disabled><span id="muteLabel">Mute Mic</span></button>
      <div class="voice-badge" id="activeVoiceBadge">Voice: Aoede</div>
      <button class="pill-btn danger hidden" id="endBtn">End Call</button>
    </footer>
  </div>

  <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
  <aside class="settings-drawer hidden" id="settingsDrawer" aria-hidden="true">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <h2>Mayra Settings</h2>
      <button class="icon-btn small" id="closeSettingsBtn" aria-label="Close">✕</button>
    </div>
    <form class="drawer-body" id="settingsForm">
      <div class="field">
        <label for="apiKeyInput">Gemini API Key</label>
        <div class="input-row">
          <input type="password" id="apiKeyInput" placeholder="AQ.Ab8... বা AIzaSy..." autocomplete="off" />
          <button type="button" class="toggle-vis-btn" id="toggleKeyBtn">Show</button>
        </div>
        <small>শুধু আপনার ফোনেই সেভ থাকবে।</small>
      </div>
      <div class="field">
        <label for="nameInput">Assistant Name</label>
        <input type="text" id="nameInput" placeholder="Mayra" maxlength="40" />
      </div>
      <div class="field">
        <label for="voiceSelect">Mayra's Voice (Female)</label>
        <select id="voiceSelect">
          <option value="Aoede">Aoede — Breezy & Sweet (Default)</option>
          <option value="Zephyr">Zephyr — Bright & Cheerful</option>
          <option value="Achernar">Achernar — Soft & Gentle</option>
          <option value="Autonoe">Autonoe — Warm & Bright</option>
          <option value="Leda">Leda — Youthful & Cute</option>
        </select>
      </div>
      <div class="field">
        <label for="modelSelect">Gemini Live Model</label>
        <select id="modelSelect">
          <option value="gemini-3.8-live">gemini-3.8-live (Recommended)</option>
          <option value="gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option>
          <option value="gemini-2.5-flash-native-audio-latest">gemini-2.5-flash-native-audio-latest</option>
        </select>
      </div>
      <div class="field">
        <div class="label-row">
          <label for="promptInput">Personality / System Prompt</label>
          <button type="button" class="text-link" id="resetPromptBtn">Reset Default</button>
        </div>
        <textarea id="promptInput" rows="4"></textarea>
      </div>
      <div class="field">
        <label for="webhookInput">Webhook URL (Optional • YouTube / n8n)</label>
        <div class="input-row">
          <input type="url" id="webhookInput" placeholder="https://your-n8n.com/webhook/mayra" />
          <button type="button" class="toggle-vis-btn" id="testWebhookBtn">Test</button>
        </div>
        <small>পরে n8n বা YouTube অটোমেশন যুক্ত করতে এখানে লিংক বসাবেন।</small>
      </div>
      <button type="submit" class="save-btn">Save Settings</button>
      <p class="save-toast hidden" id="saveToast">Settings saved!</p>
    </form>
  </aside>

  <script>
    (() => {
      const DEFAULT_PROMPT = "Your name is Mayra (মায়রা). You are a very sweet, cute, cheerful, and caring female personal AI assistant. Speak naturally in warm, friendly Bengali (and English if asked) with a cute, polite, and helpful tone. Keep voice replies concise and conversational.";
      const STORAGE_KEY = "mayra_pwa_settings_v1";
      const defaultSettings = {
        apiKey: "", name: "Mayra", voice: "Aoede",
        model: "gemini-3.8-live", systemPrompt: DEFAULT_PROMPT, webhookUrl: ""
      };
      const $ = (id) => document.getElementById(id);
      const assistantTitle = $("assistantTitle"), connectionDot = $("connectionDot"), statusText = $("statusText");
      const orbWrapper = $("orbWrapper"), orbBtn = $("orbBtn"), muteBtn = $("muteBtn"), muteLabel = $("muteLabel");
      const endBtn = $("endBtn"), activeVoiceBadge = $("activeVoiceBadge"), transcriptHint = $("transcriptHint");
      const userTranscript = $("userTranscript"), modelTranscript = $("modelTranscript");
      const openSettingsBtn = $("openSettingsBtn"), closeSettingsBtn = $("closeSettingsBtn");
      const drawerBackdrop = $("drawerBackdrop"), settingsDrawer = $("settingsDrawer"), settingsForm = $("settingsForm");
      const apiKeyInput = $("apiKeyInput"), toggleKeyBtn = $("toggleKeyBtn"), nameInput = $("nameInput");
      const voiceSelect = $("voiceSelect"), modelSelect = $("modelSelect"), promptInput = $("promptInput");
      const resetPromptBtn = $("resetPromptBtn"), webhookInput = $("webhookInput"), testWebhookBtn = $("testWebhookBtn"), saveToast = $("saveToast");

      let settings = loadSettings(), ws = null, audioCtx = null, micStream = null, micSource = null;
      let workletNode = null, fallbackProcessor = null, analyser = null, rafId = null;
      let isSessionActive = false, isMuted = false, nextPlayTime = 0, activeSources = [], speakingResetTimer = null;

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
      }
      applySettingsToUI();

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? { ...defaultSettings, ...JSON.parse(raw) } : { ...defaultSettings };
        } catch { return { ...defaultSettings }; }
      }
      function applySettingsToUI() {
        const cleanName = settings.name.trim() || "Mayra";
        assistantTitle.textContent = cleanName;
        activeVoiceBadge.textContent = "Voice: " + settings.voice;
        if (!isSessionActive) statusText.textContent = "Tap orb to talk to " + cleanName;
        apiKeyInput.value = settings.apiKey; nameInput.value = settings.name;
        voiceSelect.value = settings.voice; modelSelect.value = settings.model;
        promptInput.value = settings.systemPrompt; webhookInput.value = settings.webhookUrl;
      }
      function openDrawer() {
        applySettingsToUI(); drawerBackdrop.classList.remove("hidden"); settingsDrawer.classList.remove("hidden");
      }
      function closeDrawer() {
        drawerBackdrop.classList.add("hidden"); settingsDrawer.classList.add("hidden"); saveToast.classList.add("hidden");
      }
      openSettingsBtn.addEventListener("click", openDrawer);
      closeSettingsBtn.addEventListener("click", closeDrawer);
      drawerBackdrop.addEventListener("click", closeDrawer);
      toggleKeyBtn.addEventListener("click", () => {
        const isPass = apiKeyInput.type === "password";
        apiKeyInput.type = isPass ? "text" : "password";
        toggleKeyBtn.textContent = isPass ? "Hide" : "Show";
      });
      resetPromptBtn.addEventListener("click", () => { promptInput.value = DEFAULT_PROMPT; });
      testWebhookBtn.addEventListener("click", async () => {
        const url = webhookInput.value.trim();
        if (!url) return alert("আগে Webhook URL লিখুন।");
        testWebhookBtn.textContent = "...";
        try {
          const res = await fetch(url, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "ping", assistant: nameInput.value.trim() || "Mayra" })
          });
          alert(res.ok ? "Webhook কাজ করছে! (HTTP " + res.status + ")" : "HTTP " + res.status);
        } catch (err) { alert("Error: " + err.message); }
        finally { testWebhookBtn.textContent = "Test"; }
      });
      settingsForm.addEventListener("submit", (e) => {
        e.preventDefault();
        settings = {
          apiKey: apiKeyInput.value.trim(), name: nameInput.value.trim() || "Mayra",
          voice: voiceSelect.value, model: modelSelect.value,
          systemPrompt: promptInput.value.trim() || DEFAULT_PROMPT, webhookUrl: webhookInput.value.trim()
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        applySettingsToUI(); saveToast.classList.remove("hidden");
        setTimeout(closeDrawer, 650);
      });

      function setOrbState(state, message) {
        orbWrapper.dataset.state = state;
        if (message) statusText.textContent = message;
      }
      orbBtn.addEventListener("click", () => isSessionActive ? stopSession() : startSession());
      endBtn.addEventListener("click", () => stopSession());
      muteBtn.addEventListener("click", () => {
        if (!isSessionActive) return;
        isMuted = !isMuted;
        muteBtn.classList.toggle("active", isMuted);
        muteLabel.textContent = isMuted ? "Unmute Mic" : "Mute Mic";
        if (micStream) micStream.getAudioTracks().forEach((t) => (t.enabled = !isMuted));
        setOrbState(isMuted ? "idle" : "listening", isMuted ? "Mic muted" : settings.name + " is listening...");
      });

      async function startSession() {
        if (!settings.apiKey) { setOrbState("error", "Settings-এ গিয়ে Gemini API Key দিন"); openDrawer(); return; }
        if (!window.isSecureContext) { setOrbState("error", "HTTPS লিংক ছাড়া মাইক্রোফোন কাজ করবে না"); return; }
        try {
          setOrbState("connecting", "Connecting to " + settings.name + "...");
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass({ latencyHint: "interactive" });
          if (audioCtx.state === "suspended") await audioCtx.resume();
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          await connectWebSocket();
        } catch (err) {
          setOrbState("error", err?.name === "NotAllowedError" ? "মাইক্রোফোন পারমিশন Allow করুন" : (err?.message || "Connection failed"));
          stopSession(true);
        }
      }

      function connectWebSocket() {
        return new Promise((resolve, reject) => {
          const url = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + encodeURIComponent(settings.apiKey);
          ws = new WebSocket(url);
          let settled = false;
          ws.onopen = () => {
            const customName = settings.name.trim() || "Mayra";
            let sysPrompt = settings.systemPrompt || DEFAULT_PROMPT;
            if (customName !== "Mayra" && !sysPrompt.includes(customName)) sysPrompt = "Your name is " + customName + ". " + sysPrompt;
            const setupPayload = {
              setup: {
                model: "models/" + settings.model,
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: settings.voice } } }
                },
                systemInstruction: { parts: [{ text: sysPrompt }] },
                inputAudioTranscription: {}, outputAudioTranscription: {}
              }
            };
            if (settings.webhookUrl) {
              setupPayload.setup.tools = [{
                functionDeclarations: [{
                  name: "trigger_webhook",
                  description: "Send a task, note, YouTube link/query, or automation command to the user's n8n webhook.",
                  parameters: {
                    type: "OBJECT",
                    properties: { action: { type: "STRING" }, payload: { type: "STRING" } },
                    required: ["action", "payload"]
                  }
                }]
              }];
            }
            ws.send(JSON.stringify(setupPayload));
          };
          ws.onmessage = async (event) => {
            const text = event.data instanceof Blob ? await event.data.text() : event.data;
            const msg = JSON.parse(text);
            if (msg.setupComplete && !settled) {
              settled = true; isSessionActive = true; isMuted = false;
              connectionDot.classList.add("online"); muteBtn.disabled = false;
              endBtn.classList.remove("hidden"); transcriptHint.classList.add("hidden");
              await startMicStreaming();
              setOrbState("listening", settings.name + " is listening...");
              resolve(); return;
            }
            handleServerMessage(msg);
          };
          ws.onerror = () => {
            if (!settled) { settled = true; reject(new Error("WebSocket error — API Key বা নেটওয়ার্ক চেক করুন")); }
            else { setOrbState("error", "Connection interrupted"); stopSession(true); }
          };
          ws.onclose = (ev) => {
            if (!settled) { settled = true; reject(new Error(ev.reason || "Closed (" + ev.code + ")")); }
            else if (isSessionActive) { stopSession(true); setOrbState("idle", "Tap orb to talk to " + settings.name); }
          };
        });
      }

      function handleServerMessage(msg) {
        const sc = msg.serverContent;
        if (sc) {
          if (sc.interrupted) { clearPlaybackQueue(); setOrbState("listening", settings.name + " is listening..."); }
          if (sc.inputTranscription?.text) { userTranscript.classList.remove("hidden"); userTranscript.textContent = "You: " + sc.inputTranscription.text; }
          if (sc.outputTranscription?.text) { modelTranscript.classList.remove("hidden"); modelTranscript.textContent = settings.name + ": " + sc.outputTranscription.text; }
          for (const part of (sc.modelTurn?.parts || [])) {
            if (part.inlineData?.data && part.inlineData?.mimeType?.startsWith("audio/pcm")) {
              const rateMatch = /rate=(\d+)/i.exec(part.inlineData.mimeType || "");
              schedulePcmPlayback(part.inlineData.data, rateMatch ? parseInt(rateMatch[1], 10) : 24000);
            }
          }
          if (sc.turnComplete) {
            const waitMs = Math.max(0, (nextPlayTime - (audioCtx?.currentTime || 0)) * 1000);
            clearTimeout(speakingResetTimer);
            speakingResetTimer = setTimeout(() => {
              if (isSessionActive && !isMuted) setOrbState("listening", settings.name + " is listening...");
            }, waitMs + 120);
          }
        }
        if (msg.toolCall?.functionCalls?.length) handleToolCalls(msg.toolCall.functionCalls);
      }

      async function handleToolCalls(calls) {
        const responses = [];
        for (const call of calls) {
          if (call.name === "trigger_webhook" && settings.webhookUrl) {
            try {
              const res = await fetch(settings.webhookUrl, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ...call.args, assistant: settings.name })
              });
              responses.push({ id: call.id, name: call.name, response: { result: await res.text() || "Done" } });
            } catch (err) {
              responses.push({ id: call.id, name: call.name, response: { error: err.message } });
            }
          }
        }
        if (responses.length && ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
        }
      }

      async function startMicStreaming() {
        micSource = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
        micSource.connect(analyser); animateOrbVolume();
        if (audioCtx.audioWorklet) {
          const code = `
            class Pcm16Downsampler extends AudioWorkletProcessor {
              constructor() { super(); this.buf = []; }
              process(inputs) {
                const inp = inputs[0]?.[0]; if (!inp) return true;
                const ratio = sampleRate / 16000;
                if (ratio <= 1) { for (let i = 0; i < inp.length; i++) this.buf.push(inp[i]); }
                else { for (let p = 0; p < inp.length; p += ratio) this.buf.push(inp[Math.floor(p)]); }
                while (this.buf.length >= 640) {
                  const s = this.buf.splice(0, 640), out = new Int16Array(640);
                  for (let i = 0; i < 640; i++) { const v = Math.max(-1, Math.min(1, s[i])); out[i] = v < 0 ? v * 0x8000 : v * 0x7fff; }
                  this.port.postMessage(out.buffer, [out.buffer]);
                }
                return true;
              }
            }
            registerProcessor("pcm16-downsampler", Pcm16Downsampler);
          `;
          const blobUrl = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
          await audioCtx.audioWorklet.addModule(blobUrl); URL.revokeObjectURL(blobUrl);
          workletNode = new AudioWorkletNode(audioCtx, "pcm16-downsampler");
          workletNode.port.onmessage = (e) => sendPcmChunk(e.data);
          const silent = audioCtx.createGain(); silent.gain.value = 0;
          micSource.connect(workletNode); workletNode.connect(silent); silent.connect(audioCtx.destination);
        } else {
          fallbackProcessor = audioCtx.createScriptProcessor(2048, 1, 1);
          fallbackProcessor.onaudioprocess = (e) => {
            const inp = e.inputBuffer.getChannelData(0), ratio = audioCtx.sampleRate / 16000;
            const len = Math.round(inp.length / ratio), out = new Int16Array(len);
            for (let i = 0; i < len; i++) { const v = Math.max(-1, Math.min(1, inp[Math.floor(i * ratio)])); out[i] = v < 0 ? v * 0x8000 : v * 0x7fff; }
            sendPcmChunk(out.buffer);
          };
          micSource.connect(fallbackProcessor); fallbackProcessor.connect(audioCtx.destination);
        }
      }

      function sendPcmChunk(buf) {
        if (!ws || ws.readyState !== WebSocket.OPEN || isMuted) return;
        const bytes = new Uint8Array(buf); let bin = "";
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        ws.send(JSON.stringify({ realtimeInput: { audio: { data: btoa(bin), mimeType: "audio/pcm;rate=16000" } } }));
      }

      function schedulePcmPlayback(b64, rate) {
        if (!audioCtx) return;
        setOrbState("speaking", settings.name + " is speaking...");
        const bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const pcm16 = new Int16Array(bytes.buffer), f32 = new Float32Array(pcm16.length);
        for (let i = 0; i < pcm16.length; i++) f32[i] = pcm16[i] / 32768;
        const buf = audioCtx.createBuffer(1, f32.length, rate); buf.copyToChannel(f32, 0);
        const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(audioCtx.destination);
        const now = audioCtx.currentTime; if (nextPlayTime < now) nextPlayTime = now + 0.03;
        src.start(nextPlayTime); nextPlayTime += buf.duration;
        activeSources.push(src); src.onended = () => { activeSources = activeSources.filter((s) => s !== src); };
      }

      function clearPlaybackQueue() {
        activeSources.forEach((s) => { try { s.stop(); } catch {} });
        activeSources = []; nextPlayTime = 0;
      }

      function animateOrbVolume() {
        if (!analyser) return;
        const data = new Uint8Array(analyser.frequencyBinCount);
        const tick = () => {
          if (!isSessionActive || !analyser) { document.documentElement.style.setProperty("--orb-scale", "1"); return; }
          analyser.getByteFrequencyData(data);
          let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i];
          const boost = orbWrapper.dataset.state === "speaking" ? 0.14 : Math.min(0.22, (sum / data.length / 255) * 0.35);
          document.documentElement.style.setProperty("--orb-scale", (1 + boost).toFixed(3));
          rafId = requestAnimationFrame(tick);
        };
        rafId = requestAnimationFrame(tick);
      }

      function stopSession(keepErr = false) {
        isSessionActive = false; isMuted = false; clearTimeout(speakingResetTimer); cancelAnimationFrame(rafId);
        document.documentElement.style.setProperty("--orb-scale", "1"); clearPlaybackQueue();
        if (workletNode) { workletNode.disconnect(); workletNode = null; }
        if (fallbackProcessor) { fallbackProcessor.disconnect(); fallbackProcessor = null; }
        if (micSource) { micSource.disconnect(); micSource = null; }
        if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
        if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
        if (ws) { try { ws.close(); } catch {} ws = null; }
        connectionDot.classList.remove("online"); muteBtn.disabled = true; muteBtn.classList.remove("active");
        muteLabel.textContent = "Mute Mic"; endBtn.classList.add("hidden");
        if (!keepErr) setOrbState("idle", "Tap orb to talk to " + settings.name);
      }
    })();
  </script>
</body>
