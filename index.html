<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090710" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Mayra • মায়রা</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <style>
    :root{--bg:#07060b;--card:rgba(20,15,32,.75);--b:rgba(244,114,182,.2);--pink:#ec4899;--violet:#a855f7;--txt:#f8f5ff;--mut:#a699c2;--s:1}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;overflow:hidden;touch-action:manipulation}
    .app{position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100dvh;max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
    .glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.32;pointer-events:none}
    .g1{width:250px;height:250px;background:#6d28d9;top:-60px;left:-60px}
    .g2{width:260px;height:260px;background:var(--pink);bottom:-70px;right:-60px;opacity:.24}
    .top,.stage,.bot{position:relative;z-index:2}
    .top{display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:#64748b;transition:.3s}
    .dot.on{background:#34d399;box-shadow:0 0 12px #34d399}
    .brand h1{margin:0;font-size:1.25rem;background:linear-gradient(135deg,#fff,#f9a8d4,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{display:block;font-size:.74rem;color:var(--mut)}
    .ibtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--b);background:var(--card);color:var(--txt);display:grid;place-items:center;cursor:pointer}
    .ibtn svg{width:20px;height:20px}
    .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
    .pill{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--b);font-size:.85rem;color:#f5d0fe;text-align:center}
    .orbW{position:relative;width:210px;height:210px;display:grid;place-items:center}
    .aura{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.45),rgba(168,85,247,.25),transparent 72%);filter:blur(22px);transform:scale(var(--s))}
    .ring{position:absolute;border-radius:50%;border:1px solid rgba(244,114,182,.25);pointer-events:none}
    .r1{inset:0;border-style:dashed;animation:spin 16s linear infinite}
    .r2{inset:18px}
    .orb{position:relative;width:144px;height:144px;border-radius:50%;border:none;padding:3px;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 0 32px rgba(236,72,153,.45);cursor:pointer;transform:scale(var(--s));transition:transform .08s}
    .core{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a1842,#110b1d 70%,#090611);display:grid;place-items:center}
    .mic{width:44px;height:44px;color:#fdf2f8}
    .orbW[data-st="idle"] .orb{animation:br 3.5s ease-in-out infinite}
    .orbW[data-st="listening"] .r2{animation:rip 1.7s ease-out infinite;border-color:rgba(244,114,182,.75)}
    .orbW[data-st="speaking"] .r2{animation:rip 1.1s ease-out infinite;border-color:rgba(192,132,252,.85)}
    .orbW[data-st="speaking"] .orb{background:linear-gradient(135deg,#f472b6,#c084fc,#818cf8);box-shadow:0 0 50px rgba(192,132,252,.8)}
    .orbW[data-st="error"] .orb{background:linear-gradient(135deg,#fb7185,#be123c)}
    .tbox{width:100%;min-height:80px;max-height:135px;overflow-y:auto;padding:12px 16px;border-radius:18px;background:rgba(18,13,29,.65);border:1px solid rgba(255,255,255,.08);font-size:.88rem;line-height:1.5}
    .thint{margin:0;color:var(--mut);text-align:center;font-size:.82rem}
    .tline{margin:4px 0}.ul{color:#f9a8d4}.ml{color:#e9d5ff}
    .bot{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .badge{font-size:.76rem;color:var(--mut);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
    .pbtn{border:1px solid var(--b);background:var(--card);color:var(--txt);padding:9px 14px;border-radius:999px;font-size:.8rem;cursor:pointer}
    .pbtn:disabled{opacity:.4}.pbtn.act{background:rgba(236,72,153,.24);border-color:var(--pink)}
    .pbtn.dng{border-color:rgba(251,113,133,.5);color:#fecdd3;background:rgba(190,18,60,.25)}
    .bk{position:fixed;inset:0;background:rgba(3,2,7,.72);z-index:20}
    .drw{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:88dvh;background:#110c1c;border-top:1px solid var(--b);border-radius:26px 26px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column}
    .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.dh h2{margin:0;font-size:1.1rem}
    .db{overflow-y:auto;display:flex;flex-direction:column;gap:12px}
    .f{display:flex;flex-direction:column;gap:5px}.f label{font-size:.82rem;color:#e9d5ff}
    .f input,.f select,.f textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--txt);font-size:.9rem;font-family:inherit}
    .f select option{background:#140e22}
    .row{display:flex;gap:8px}.sbtn{padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer}
    .save{padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-size:.95rem;font-weight:600;cursor:pointer}
    .hid{display:none!important}
    @keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes rip{0%{transform:scale(.95);opacity:.85}100%{transform:scale(1.38);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="app">
    <div class="glow g1"></div><div class="glow g2"></div>
    <header class="top">
      <div class="brand"><span class="dot" id="cDot"></span><div><h1 id="aTitle">Mayra</h1><span class="sub">মায়রা • Personal Voice AI</span></div></div>
      <button class="ibtn" id="openSet" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.51 1H21a2 2 0 1 1 0 4h-.09c-.74-.02-1.25.4-1.51 1z"/></svg></button>
    </header>
    <main class="stage">
      <div class="pill"><span id="stTxt">Tap orb to talk to Mayra</span></div>
      <div class="orbW" id="orbW" data-st="idle">
        <div class="ring r1"></div><div class="ring r2"></div><div class="aura"></div>
        <button class="orb" id="orbBtn"><div class="core"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div></button>
      </div>
      <div class="tbox" id="tBox">
        <p class="thint" id="tHint">"হ্যালো মায়রা, কেমন আছো?" — স্বাভাবিকভাবে বাংলায় বলুন।</p>
        <p class="tline ul hid" id="uTxt"></p><p class="tline ml hid" id="mTxt"></p>
      </div>
    </main>
    <footer class="bot">
      <button class="pbtn" id="muteBtn" disabled>Mute Mic</button>
      <div class="badge" id="vBadge">Voice: Aoede</div>
      <button class="pbtn dng hid" id="endBtn">End Call</button>
    </footer>
  </div>
  <div class="bk hid" id="bk"></div>
  <aside class="drw hid" id="drw">
    <div class="dh"><h2>Mayra Settings</h2><button class="ibtn" id="clsSet" style="width:34px;height:34px">✕</button></div>
    <form class="db" id="sForm">
      <div class="f"><label>Gemini API Key</label><div class="row"><input type="password" id="kIn" placeholder="AQ.Ab8..."><button type="button" class="sbtn" id="tKey">Show</button></div></div>
      <div class="f"><label>Assistant Name</label><input type="text" id="nIn" placeholder="Mayra"></div>
      <div class="f"><label>Voice (Female)</label><select id="vSel"><option value="Aoede">Aoede (Default)</option><option value="Zephyr">Zephyr</option><option value="Achernar">Achernar</option><option value="Autonoe">Autonoe</option><option value="Leda">Leda</option></select></div>
      <div class="f"><label>Live Model</label><select id="mSel"><option value="gemini-2.5-flash-native-audio-preview-12-2025">gemini-2.5-flash-native-audio (Best Bengali)</option><option value="gemini-3.8-live">gemini-3.8-live</option></select></div>
      <div class="f"><label>System Prompt</label><textarea id="pIn" rows="3"></textarea></div>
      <div class="f"><label>Webhook URL (n8n / YouTube)</label><input type="url" id="wIn" placeholder="https://..."></div>
      <button type="submit" class="save">Save Settings</button>
    </form>
  </aside>
  <script>
    (() => {
      const DEF_P = "Your name is Mayra (মায়রা). You are a very sweet, cute, cheerful, and caring female personal AI assistant. Speak naturally in warm, friendly Bengali (and English if asked) with a cute, polite, and helpful tone. Keep voice replies concise and conversational.";
      const KEY = "mayra_pwa_settings_v1";
      const DEF = { apiKey: "", name: "Mayra", voice: "Aoede", model: "gemini-2.5-flash-native-audio-preview-12-2025", systemPrompt: DEF_P, webhookUrl: "", v3: true };
      const $ = (id) => document.getElementById(id);
      let s = load(), ws = null, micCtx = null, playCtx = null, stream = null, worklet = null, analyser = null, raf = null;
      let active = false, muted = false, nextT = 0, srcs = [], timer = null, uAcc = "", mAcc = "";

      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
      syncUI();

      function load() {
        try {
          const d = JSON.parse(localStorage.getItem(KEY) || "null");
          if (!d) return { ...DEF };
          if (!d.v3) { d.model = DEF.model; d.v3 = true; localStorage.setItem(KEY, JSON.stringify(d)); }
          return { ...DEF, ...d };
        } catch { return { ...DEF }; }
      }
      function syncUI() {
        $("aTitle").textContent = s.name || "Mayra";
        $("vBadge").textContent = "Voice: " + s.voice;
        if (!active) $("stTxt").textContent = "Tap orb to talk to " + (s.name || "Mayra");
        $("kIn").value = s.apiKey; $("nIn").value = s.name; $("vSel").value = s.voice;
        $("mSel").value = s.model; $("pIn").value = s.systemPrompt; $("wIn").value = s.
