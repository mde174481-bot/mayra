<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#090710" />
  <title>Mayra • মায়রা</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <style>
    :root{--bg:#07060b;--card:rgba(20,15,32,.78);--b:rgba(244,114,182,.22);--pk:#ec4899;--vl:#a855f7;--tx:#f8f5ff;--mt:#a699c2;--s:1}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;overflow:hidden;touch-action:manipulation}
    .app{position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100dvh;max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
    .gl{position:absolute;border-radius:50%;filter:blur(80px);opacity:.3;pointer-events:none}
    .g1{width:240px;height:240px;background:#6d28d9;top:-60px;left:-60px}.g2{width:250px;height:250px;background:var(--pk);bottom:-70px;right:-60px;opacity:.22}
    .top,.stg,.bot{position:relative;z-index:2}.top{display:flex;align-items:center;justify-content:space-between}
    .br{display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:#64748b;transition:.3s}
    .dot.on{background:#34d399;box-shadow:0 0 12px #34d399}
    .br h1{margin:0;font-size:1.25rem;background:linear-gradient(135deg,#fff,#f9a8d4,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{display:block;font-size:.74rem;color:var(--mt)}
    .ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--b);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:1.1rem}
    .stg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
    .pill{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--b);font-size:.85rem;color:#f5d0fe;text-align:center}
    .ow{position:relative;width:200px;height:200px;display:grid;place-items:center}
    .au{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.45),rgba(168,85,247,.25),transparent 72%);filter:blur(22px);transform:scale(var(--s))}
    .rg{position:absolute;border-radius:50%;border:1px solid rgba(244,114,182,.25);pointer-events:none}
    .r1{inset:0;border-style:dashed;animation:sp 16s linear infinite}.r2{inset:18px}
    .orb{position:relative;width:140px;height:140px;border-radius:50%;border:none;padding:3px;background:linear-gradient(135deg,var(--pk),var(--vl));box-shadow:0 0 32px rgba(236,72,153,.45);cursor:pointer;transform:scale(var(--s));transition:transform .1s}
    .cor{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a1842,#110b1d 70%,#090611);display:grid;place-items:center}
    .mic{width:42px;height:42px;color:#fdf2f8}
    .ow[data-st="idle"] .orb{animation:br 3.5s ease-in-out infinite}
    .ow[data-st="listening"] .r2{animation:rp 1.6s ease-out infinite;border-color:rgba(244,114,182,.8)}
    .ow[data-st="speaking"] .r2{animation:rp 1s ease-out infinite;border-color:rgba(192,132,252,.9)}
    .ow[data-st="speaking"] .orb{background:linear-gradient(135deg,#f472b6,#c084fc,#818cf8);box-shadow:0 0 50px rgba(192,132,252,.85)}
    .ow[data-st="error"] .orb{background:linear-gradient(135deg,#fb7185,#be123c)}
    .tb{width:100%;min-height:86px;max-height:145px;overflow-y:auto;padding:12px 16px;border-radius:18px;background:rgba(18,13,29,.68);border:1px solid rgba(255,255,255,.08);font-size:.88rem;line-height:1.5}
    .th{margin:0;color:var(--mt);text-align:center;font-size:.82rem}
    .tl{margin:4px 0}.ul{color:#f9a8d4}.ml{color:#e9d5ff}
    .actLink{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:12px;background:linear-gradient(135deg,var(--pk),var(--vl));color:#fff;text-decoration:none;font-size:.82rem;font-weight:600}
    .bot{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .bg{font-size:.76rem;color:var(--mt);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
    .pb{border:1px solid var(--b);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:999px;font-size:.8rem;cursor:pointer}
    .pb:disabled{opacity:.4}.pb.act{background:rgba(236,72,153,.24);border-color:var(--pk)}
    .pb.dng{border-color:rgba(251,113,133,.5);color:#fecdd3;background:rgba(190,18,60,.25)}
    .bk{position:fixed;inset:0;background:rgba(3,2,7,.72);z-index:20}
    .dr{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:88dvh;background:#110c1c;border-top:1px solid var(--b);border-radius:26px 26px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column}
    .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.dh h2{margin:0;font-size:1.1rem}
    .db{overflow-y:auto;display:flex;flex-direction:column;gap:12px}.f{display:flex;flex-direction:column;gap:5px}.f label{font-size:.82rem;color:#e9d5ff}
    .f input,.f select,.f textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--tx);font-size:.9rem;font-family:inherit}
    .f select option{background:#140e22}.row{display:flex;gap:8px}
    .sb{padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--tx);cursor:pointer}
    .sv{padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--pink,#ec4899),var(--vl));color:#fff;font-size:.95rem;font-weight:600;cursor:pointer}
    .hid{display:none!important}
    @keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes rp{0%{transform:scale(.95);opacity:.85}100%{transform:scale(1.38);opacity:0}}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="app">
    <div class="gl g1"></div><div class="gl g2"></div>
    <header class="top">
      <div class="br"><span class="dot" id="dot"></span><div><h1 id="aT">Mayra</h1><span class="sub">মায়রা • Ibrahim's AI</span></div></div>
      <button class="ib" id="oSet">⚙️</button>
    </header>
    <main class="stg">
      <div class="pill"><span id="st">Tap orb to talk to Mayra</span></div>
      <div class="ow" id="ow" data-st="idle">
        <div class="rg r1"></div><div class="rg r2"></div><div class="au"></div>
        <button class="orb" id="orb"><div class="cor"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div></button>
      </div>
      <div class="tb" id="tb">
        <p class="th" id="th">"হ্যালো মায়রা, ইউটিউবে বাংলা গান খোলো" — সাধারণ গলায় বাংলা বলুন।</p>
        <p class="tl ul hid" id="ut"></p><p class="tl ml hid" id="mt"></p>
        <a class="actLink hid" id="actL" target="_blank" rel="noopener">Open Action</a>
      </div>
    </main>
    <footer class="bot">
      <button class="pb" id="mBtn" disabled>Mute Mic</button>
      <div class="bg" id="vBg">Voice: Aoede</div>
      <button class="pb dng hid" id="eBtn">End Call</button>
    </footer>
  </div>
  <div class="bk hid" id="bk"></div>
  <aside class="dr hid" id="dr">
    <div class="dh"><h2>Mayra Settings</h2><button class="ib" id="cSet" style="width:34px;height:34px">✕</button></div>
    <form class="db" id="sf">
      <div class="f"><label>Gemini API Key</label><div class="row"><input type="password" id="kI"><button type="button" class="sb" id="tk">Show</button></div></div>
      <div class="f"><label>Assistant Name</label><input type="text" id="nI"></div>
      <div class="f"><label>Voice (Female)</label><select id="vS"><option value="Aoede">Aoede (Default)</option><option value="Zephyr">Zephyr</option><option value="Achernar">Achernar</option><option value="Autonoe">Autonoe</option><option value="Leda">Leda</option></select></div>
      <div class="f"><label>Live Model</label><select id="mS"><option value="gemini-3.8-live">gemini-3.8-live</option><option value="gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option></select></div>
      <div class="f"><label>System Prompt</label><textarea id="pI" rows="3"></textarea></div>
      <div class="f"><label>Webhook URL (MacroDroid / n8n)</label><input type="url" id="wI" placeholder="https://..."></div>
      <button type="submit" class="sv">Save Settings</button>
    </form>
  </aside>
  <script>
    (() => {
      const DP = "Your name is Mayra (মায়রা). Your creator is Ibrahim (ইব্রাহিম) from Bangladesh. Always call him ইব্রাহিম, and if asked who made you, say আমাকে ইব্রাহিম বানিয়েছে. Speak in sweet, concise, natural Bangladeshi Bengali. Use open_phone_action when Ibrahim asks to search YouTube, Google, or dial a number; use trigger_webhook if configured.";
      const K = "mayra_pwa_settings_v3", $ = (id) => document.getElementById(id);
      const DEF = { apiKey: "", name: "Mayra", voice: "Aoede", model: "gemini-3.8-live", systemPrompt: DP, webhookUrl: "" };
      let s = load(), ws = null, pc = null, rec = null, nt = 0, q = [], tm = null;
      let on = false, mut = false, spk = false, mA = "";

      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
      ui();

      function load() {
        try {
          const cur = JSON.parse(localStorage.getItem(K) || "null");
          if (cur) return { ...DEF, ...cur };
          const old = JSON.parse(localStorage.getItem("mayra_pwa_settings_v2") || localStorage.getItem("mayra_pwa_settings_v1") || "{}");
          return { ...DEF, apiKey: old.apiKey || "", webhookUrl: old.webhookUrl || "" };
        } catch { return { ...DEF }; }
      }
      function ui() {
        $("aT").textContent = s.name || "Mayra"; $("vBg").textContent = "Voice: " + s.voice;
        if (!on) $("st").textContent = "Tap orb to talk to " + (s.name || "Mayra");
        $("kI").value = s.apiKey; $("nI").value = s.name; $("vS").value = s.voice;
        $("mS").value = s.model; $("pI").value = s.systemPrompt; $("wI").value = s.webhookUrl;
      }
      function drw(v) { $("bk").classList.toggle("hid", !v); $("dr").classList.toggle("hid", !v); if (v) ui(); }
      $("oSet").onclick = () => drw(true); $("cSet").onclick = $("bk").onclick = () => drw(false);
      $("tk").onclick = () => { const p = $("kI").type === "password"; $("kI").type = p ? "text" : "password"; $("tk").textContent = p ? "Hide" : "Show"; };
      $("sf").onsubmit = (e) => {
        e.preventDefault();
        s = { apiKey: $("kI").value.trim(), name: $("nI").value.trim() || "Mayra", voice: $("vS").value, model: $("mS").value, systemPrompt: $("pI").value.trim() || DP, webhookUrl: $("wI").value.trim() };
        localStorage.setItem(K, JSON.stringify(s)); ui(); drw(false);
      };
      function set(x, m) { $("ow").dataset.st = x; if (m) $("st").textContent = m; }
      $("orb").onclick = () => on ? stop() : go();
      $("eBtn").onclick = () => stop();
      $("mBtn").onclick = () => {
        if (!on) return; mut = !mut; $("mBtn").classList.toggle("act", mut);
        $("mBtn").textContent = mut ? "Unmute Mic" : "Mute Mic";
        if (mut) { try { rec?.stop(); } catch {} set("idle", "Mic muted"); }
        else if (!spk) { startRec(); set("listening", s.name + " is listening..."); }
      };

      async function go() {
        if (!s.apiKey) { set("error", "Settings-এ API Key দিন"); return drw(true); }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return set("error", "Google Chrome ব্যবহার করুন");
        try {
          set("connecting", "Connecting to " + s.name + "...");
          const AC = window.AudioContext || window.webkitAudioContext;
          pc = new AC({ sampleRate: 24000, latencyHint: "interactive" });
          if (pc.state === "suspended") await pc.resume();
          await openWS();
          setupRec(SR);
        } catch (e) { set("error", e?.message || "Failed"); stop(true); }
      }

      function setupRec(SR) {
        rec = new SR();
        rec.lang = "bn-BD";
        rec.continuous = false;
        rec.interimResults = true;
        rec.onresult = (ev) => {
          let txt = "", fin = false;
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            txt += ev.results[i][0].transcript;
            if (ev.results[i].isFinal) fin = true;
          }
          if (!txt.trim()) return;
          $("ut").classList.remove("hid"); $("ut").textContent = "Ibrahim: " + txt; $("tb").scrollTop = 9999;
          if (fin && ws?.readyState === 1) {
            spk = true; try { rec.stop(); } catch {}
            set("connecting", s.name + " thinking...");
            sendText(txt.trim());
          }
        };
        rec.onerror = (ev) => {
          if (ev.error === "not-allowed") { set("error", "মাইক্রোফোন Allow করুন"); stop(true); }
        };
        rec.onend = () => {
          if (on && !mut && !spk) setTimeout(startRec, 220);
        };
        startRec();
      }

      function startRec() {
        if (!on || mut || spk || !rec) return;
        try { rec.start(); set("listening", s.name + " বাংলায় শুনছে..."); } catch {}
      }

      function sendText(text) {
        if (!ws || ws.readyState !== 1) return;
        mA = ""; $("actL").classList.add("hid");
        if (s.model.includes("3.1")) ws.send(JSON.stringify({ realtimeInput: { text } }));
        else ws.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text }] }], turnComplete: true } }));
      }

      function openWS() {
        return new Promise((res, rej) => {
          ws = new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + encodeURIComponent(s.apiKey));
          let ok = false;
          ws.onopen = () => {
            const decls = [{
              name: "open_phone_action",
              description: "Open YouTube search, Google search, or Phone dialer on user's phone",
              parameters: { type: "OBJECT", properties: { type: { type: "STRING", description: "youtube, google, or call" }, query: { type: "STRING", description: "search text or phone number" } }, required: ["type", "query"] }
            }];
            if (s.webhookUrl) decls.push({ name: "trigger_webhook", description: "Trigger MacroDroid or n8n webhook URL", parameters: { type: "OBJECT", properties: { action: { type: "STRING" }, payload: { type: "STRING" } }, required: ["action", "payload"] } });
            ws.send(JSON.stringify({ setup: {
              model: "models/" + s.model,
              generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: s.voice } } } },
              systemInstruction: { parts: [{ text: s.systemPrompt || DP }] },
              tools: [{ functionDeclarations: decls }],
              outputAudioTranscription: {}
            }}));
          };
          ws.onmessage = async (ev) => {
            const msg = JSON.parse(ev.data instanceof Blob ? await ev.data.text() : ev.data);
            if (msg.setupComplete && !ok) {
              ok = true; on = true; mut = false; spk = false; $("dot").classList.add("on");
              $("mBtn").disabled = false; $("eBtn").classList.remove("hid"); $("th").classList.add("hid");
              res(); return;
            }
            const sc = msg.serverContent;
            if (sc) {
              if (sc.outputTranscription?.text) { mA += sc.outputTranscription.text; $("mt").classList.remove("hid"); $("mt").textContent = s.name + ": " + mA; $("tb").scrollTop = 9999; }
              for (const p of (sc.modelTurn?.parts || [])) {
                if (p.inlineData?.data && p.inlineData?.mimeType?.startsWith("audio/pcm")) {
                  const r = /rate=(\d+)/i.exec(p.inlineData.mimeType || "");
                  play(p.inlineData.data, r ? parseInt(r[1], 10) : 24000);
                }
              }
              if (sc.turnComplete) {
                const w = Math.max(0, (nt - (pc?.currentTime || 0)) * 1000);
                clearTimeout(tm);
                tm = setTimeout(() => { spk = false; if (on && !mut) startRec(); }, w + 250);
              }
            }
            if (msg.toolCall?.functionCalls?.length) runTools(msg.toolCall.functionCalls);
          };
          ws.onerror = () => { if (!ok) { ok = true; rej(new Error("WebSocket error")); } else { set("error", "Disconnected"); stop(true); } };
          ws.onclose = (ev) => { if (!ok) { ok = true; rej(new Error(ev.reason || "Closed")); } else if (on) stop(true); };
        });
      }

      async function runTools(cs) {
        const out = [];
        for (const c of cs) {
          if (c.name === "open_phone_action") {
            const { type, query } = c.args || {};
            let url = "https://www.google.com/search?q=" + encodeURIComponent(query || ""), lbl = "Google Search";
            if (type === "youtube") { url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query || ""); lbl = "Open YouTube: " + query; }
            else if (type === "call") { url = "tel:" + (query || "").replace(/[^0-9+]/g, ""); lbl = "Call " + query; }
            $("actL").href = url; $("actL").textContent = lbl; $("actL").classList.remove("hid");
            try { window.open(url, "_blank"); } catch {}
            out.push({ id: c.id, name: c.name, response: { result: "Opened " + lbl } });
          } else if (c.name === "trigger_webhook" && s.webhookUrl) {
            try {
              const r = await fetch(s.webhookUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(c.args) });
              out.push({ id: c.id, name: c.name, response: { result: await r.text() || "Triggered" } });
            } catch (e) { out.push({ id: c.id, name: c.name, response: { error: e.message } }); }
          }
        }
        if (out.length && ws?.readyState === 1) ws.send(JSON.stringify({ toolResponse: { functionResponses: out } }));
      }

      function play(b64, rate) {
        if (!pc) return; spk = true; set("speaking", s.name + " is speaking...");
        const bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const p16 = new Int16Array(bytes.buffer), f32 = new Float32Array(p16.length);
        for (let i = 0; i < p16.length; i++) f32[i] = p16[i] / 32768;
        const buf = pc.createBuffer(1, f32.length, rate); buf.copyToChannel(f32, 0);
        const src = pc.createBufferSource(); src.buffer = buf; src.connect(pc.destination);
        const now = pc.currentTime; if (nt < now) nt = now + 0.03;
        src.start(nt); nt += buf.duration; q.push(src); src.onended = () => { q = q.filter((x) => x !== src); };
      }

      function stop(ke = false) {
        on = false; mut = false; spk = false; clearTimeout(tm);
        try { rec?.stop(); } catch {} rec = null;
        q.forEach((x) => { try { x.stop(); } catch {} }); q = []; nt = 0;
        if (pc) { pc.close().catch(() => {}); pc = null; }
        if (ws) { try { ws.close(); } catch {} ws = null; }
        $("dot").classList.remove("on"); $("mBtn").disabled = true; $("mBtn").classList.remove("act");
        $("mBtn").textContent = "Mute Mic"; $("eBtn").classList.add("hid");
        if (!ke) set("idle", "Tap orb to talk to " + s.name);
      }
    })();
  </script>
</body>
</html>
